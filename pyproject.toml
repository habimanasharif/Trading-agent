[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Research-first forex signal and risk assistant"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3.0", "numpy>=1.26,<3.0", "python-dotenv>=1.0,<2.0", "requests>=2.31,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
